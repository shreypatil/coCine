# coturn for coCine.
#
# Voice only. Bulk film transfer is never given these credentials, because a
# relayed film crosses this server twice -- 4 GB in and 4 GB out for a single
# viewer -- and defeats the point of peer to peer entirely.

listening-port=3478
tls-listening-port=443

# Credentials are minted per session by the signalling server as an HMAC over an
# expiry timestamp, under the shared secret below. No account list exists and
# nothing needs provisioning. A relay with fixed credentials is found and abused
# by strangers within days, and every relayed byte is billed to whoever runs it.
use-auth-secret
static-auth-secret=CHANGE-ME-A-LONG-RANDOM-STRING
realm=cocine.local

# Do not let anyone use this relay to reach private networks. Without these a
# TURN server is a way in to whatever it can route to.
no-multicast-peers

# IPv4.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Carrier-grade NAT space. On a VPS this is usually nothing, but a relay hosted
# on a carrier network can reach that carrier's other customers through it.
denied-peer-ip=100.64.0.0-100.127.255.255

# IPv6. The list has to be its own thing rather than an afterthought: this
# server binds both families, so an allocation can be asked to relay to an IPv6
# peer, and the careful IPv4 list above says nothing at all about that request.
denied-peer-ip=::
denied-peer-ip=::1
# Link-local. Reachable from the relay's own segment and from nowhere else,
# which is exactly what makes it worth asking for.
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Unique-local, the IPv6 equivalent of 10.0.0.0/8.
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# IPv4-mapped addresses, and the reason this block is not merely tidiness.
# ::ffff:127.0.0.1 and 127.0.0.1 name the same host, but only one of them is
# matched by the IPv4 rules above -- so on a dual-stack listener every denial in
# that list can be walked around by spelling the address the other way. Deny the
# whole ::ffff:0:0/96 mapping rather than restating each range in IPv6 form,
# because coCine never has a legitimate reason to relay to one.
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff

# Relay ports. Open this range in the firewall along with 3478 and 443.
min-port=49160
max-port=49200

# TLS on 443 gets through networks that block UDP and non-standard ports, which
# is most corporate ones. Supply real certificates in production.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem

fingerprint
stale-nonce=600
no-cli
log-file=stdout
