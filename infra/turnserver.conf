# coturn for coCine.
#
# Voice only. Bulk film transfer is never given these credentials, because a
# relayed film crosses this server twice -- 4 GB in and 4 GB out for a single
# viewer -- and defeats the point of peer to peer entirely.

listening-port=3478
tls-listening-port=443

# Credentials are minted per session by the signalling server as an HMAC over an
# expiry timestamp, under the shared secret below. No account list exists and
# nothing needs provisioning. A relay with fixed credentials is found and abused
# by strangers within days, and every relayed byte is billed to whoever runs it.
use-auth-secret
static-auth-secret=CHANGE-ME-A-LONG-RANDOM-STRING
realm=cocine.local

# Do not let anyone use this relay to reach private networks. Without these a
# TURN server is a way in to whatever it can route to.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Relay ports. Open this range in the firewall along with 3478 and 443.
min-port=49160
max-port=49200

# TLS on 443 gets through networks that block UDP and non-standard ports, which
# is most corporate ones. Supply real certificates in production.
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem

fingerprint
stale-nonce=600
no-cli
log-file=stdout
